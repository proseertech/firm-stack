name: Skill Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-review-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Lint review skills against canonical findings-table block
        run: python3 scripts/lint_review_skills.py
